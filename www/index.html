<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#0a0a0f">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon.svg">
    <link rel="icon" type="image/svg+xml" href="icon.svg">
    <title>NIFTY AI Trader</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        html, body { 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0a0a0f;
            color: #e0e0e0;
            min-height: 100vh;
            overflow-x: hidden;
            padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
        }
        
        .app {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            padding: 12px;
            gap: 12px;
        }
        
        /* Header */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            background: linear-gradient(135deg, #12121a 0%, #1a1a25 100%);
            border-radius: 16px;
            border: 1px solid #252530;
        }
        .logo {
            font-size: 1.1rem;
            font-weight: 700;
            background: linear-gradient(90deg, #00d4ff, #7b2dff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .header-right { display: flex; align-items: center; gap: 12px; }
        .status-badge {
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 6px 12px;
            background: #1a1a25;
            border-radius: 20px;
            font-size: 0.75rem;
        }
        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #3fb950;
            animation: pulse 2s infinite;
        }
        .status-dot.off { background: #f85149; animation: none; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
        
        /* Power Button */
        .power-btn {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            border: 2px solid #3fb950;
            background: linear-gradient(135deg, #1a3d1a 0%, #0d1117 100%);
            color: #3fb950;
            font-size: 1.4rem;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(63, 185, 80, 0.3);
            transition: all 0.3s ease;
        }
        .power-btn:active { transform: scale(0.95); }
        .power-btn.off {
            border-color: #f85149;
            background: linear-gradient(135deg, #3d1a1a 0%, #0d1117 100%);
            color: #f85149;
            box-shadow: 0 0 20px rgba(248, 81, 73, 0.3);
        }
        
        /* Price Section */
        .price-card {
            background: linear-gradient(135deg, #12121a 0%, #1a1a25 100%);
            border-radius: 16px;
            border: 1px solid #252530;
            padding: 20px;
            text-align: center;
        }
        .price-label { font-size: 0.8rem; color: #888; margin-bottom: 4px; }
        .price-value { font-size: 2.2rem; font-weight: 700; }
        .price-value.up { color: #3fb950; }
        .price-value.down { color: #f85149; }
        .price-change { font-size: 0.9rem; margin-top: 4px; }
        
        /* Decision Card */
        .decision-card {
            text-align: center;
            padding: 24px 16px;
            border-radius: 16px;
            border: 2px solid #252530;
            background: linear-gradient(135deg, #12121a 0%, #1a1a25 100%);
            transition: all 0.3s ease;
        }
        .decision-card.call {
            border-color: #3fb950;
            background: linear-gradient(135deg, #0d1a0d 0%, #1a3d1a 100%);
            box-shadow: 0 0 30px rgba(63, 185, 80, 0.2);
        }
        .decision-card.put {
            border-color: #f85149;
            background: linear-gradient(135deg, #1a0d0d 0%, #3d1a1a 100%);
            box-shadow: 0 0 30px rgba(248, 81, 73, 0.2);
        }
        .decision-card.exit {
            border-color: #f0883e;
            background: linear-gradient(135deg, #1a150d 0%, #3d2a1a 100%);
            box-shadow: 0 0 30px rgba(240, 136, 62, 0.2);
        }
        .decision-label { font-size: 0.8rem; color: #888; margin-bottom: 8px; }
        .decision-value { font-size: 1.8rem; font-weight: 700; }
        .decision-value.call { color: #3fb950; }
        .decision-value.put { color: #f85149; }
        .decision-value.exit { color: #f0883e; }
        .decision-value.wait { color: #888; }
        .confidence-bar {
            margin-top: 12px;
            height: 6px;
            background: #252530;
            border-radius: 3px;
            overflow: hidden;
        }
        .confidence-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #3fb950, #00d4ff);
            border-radius: 3px;
            transition: width 0.5s ease;
        }
        .confidence-text { font-size: 0.8rem; color: #888; margin-top: 6px; }
        
        /* Tabs */
        .tabs {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding-bottom: 4px;
        }
        .tab {
            flex: 1;
            min-width: fit-content;
            padding: 10px 12px;
            background: #1a1a25;
            border: 1px solid #252530;
            border-radius: 10px;
            color: #888;
            font-size: 0.75rem;
            cursor: pointer;
            white-space: nowrap;
        }
        .tab.active {
            background: linear-gradient(135deg, #1a3d1a 0%, #0d1117 100%);
            border-color: #3fb950;
            color: #3fb950;
        }
        
        /* Tab Content */
        .tab-content {
            flex: 1;
            background: linear-gradient(135deg, #12121a 0%, #1a1a25 100%);
            border-radius: 16px;
            border: 1px solid #252530;
            padding: 12px;
            overflow-y: auto;
            min-height: 200px;
        }
        .tab-content.hidden { display: none; }
        
        /* Indicators */
        .indicator-row {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid #1a1a25;
            font-size: 0.85rem;
        }
        .indicator-row:last-child { border-bottom: none; }
        .ind-name { color: #888; }
        .ind-value { font-weight: 600; }
        .ind-value.bullish { color: #3fb950; }
        .ind-value.bearish { color: #f85149; }
        .ind-value.neutral { color: #f0883e; }
        
        /* News */
        .news-header {
            display: flex;
            justify-content: space-between;
            font-size: 0.8rem;
            color: #888;
            margin-bottom: 10px;
        }
        .news-item {
            padding: 10px;
            background: #0d0d12;
            border-radius: 8px;
            margin-bottom: 8px;
            font-size: 0.8rem;
        }
        .news-sentiment { font-size: 0.7rem; margin-top: 5px; }
        .news-sentiment.positive { color: #3fb950; }
        .news-sentiment.negative { color: #f85149; }
        .news-sentiment.neutral { color: #888; }
        
        /* Reasoning */
        .reasoning-item {
            padding: 10px 0;
            border-bottom: 1px solid #1a1a25;
            font-size: 0.8rem;
            color: #aaa;
        }
        .reasoning-item:last-child { border-bottom: none; }
        .tag {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 0.7rem;
            margin-right: 8px;
        }
        .tag.tech { background: #1a3d1a; color: #3fb950; }
        .tag.news { background: #1a1a3d; color: #7b2dff; }
        .tag.sentiment { background: #3d1a1a; color: #f85149; }
        
        /* History */
        .history-stats {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 12px;
            font-size: 0.85rem;
        }
        .stat.winners { color: #3fb950; }
        .stat.losers { color: #f85149; }
        .stat.exits { color: #f0883e; }
        .history-item {
            background: #0d0d12;
            border-radius: 8px;
            padding: 10px;
            margin-bottom: 8px;
            font-size: 0.8rem;
            border-left: 3px solid;
        }
        .history-item.winner { border-color: #3fb950; }
        .history-item.loser { border-color: #f85149; }
        .history-item.exit { border-color: #f0883e; }
        .history-item .time { color: #666; font-size: 0.7rem; }
        .history-item .signal { font-weight: 600; margin: 3px 0; }
        
        /* Alert Popup */
        .alert-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 20px;
        }
        .alert-overlay.show { display: flex; }
        .alert-box {
            background: #12121a;
            border-radius: 20px;
            padding: 30px;
            text-align: center;
            border: 3px solid;
            width: 100%;
            max-width: 320px;
            animation: popIn 0.3s ease;
        }
        @keyframes popIn { from { transform: scale(0.8); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        .alert-box.call { border-color: #3fb950; box-shadow: 0 0 40px rgba(63, 185, 80, 0.4); }
        .alert-box.put { border-color: #f85149; box-shadow: 0 0 40px rgba(248, 81, 73, 0.4); }
        .alert-box.exit { border-color: #f0883e; box-shadow: 0 0 40px rgba(240, 136, 62, 0.4); }
        .alert-title { font-size: 1.6rem; font-weight: 700; margin-bottom: 10px; }
        .alert-price { font-size: 1.3rem; color: #00d4ff; margin-bottom: 10px; }
        .alert-reason { color: #888; font-size: 0.85rem; margin-bottom: 20px; }
        .alert-btn {
            padding: 12px 40px;
            border: none;
            border-radius: 8px;
            background: #252530;
            color: #fff;
            font-size: 1rem;
            cursor: pointer;
        }
        .alert-btn:active { background: #353545; }
        
        /* Scrollbar */
        ::-webkit-scrollbar { width: 4px; height: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #252530; border-radius: 2px; }
</style>
</head>
<body>
    <div class="app">
        <div class="header">
            <div class="logo">🤖 NIFTY AI</div>
            <div class="header-right">
                <div class="status-badge">
                    <div class="status-dot" id="marketDot"></div>
                    <span id="marketStatus">--</span>
                </div>
                <button class="power-btn" id="powerBtn" onclick="toggleSystem()">⏻</button>
            </div>
        </div>
        
        <div class="price-card">
            <div class="price-label">NIFTY 50</div>
            <div class="price-value" id="price">--,---</div>
            <div class="price-change" id="priceChange">Loading...</div>
        </div>
        
        <div class="decision-card" id="decisionBox">
            <div class="decision-label">🧠 AI DECISION</div>
            <div class="decision-value wait" id="decision">ANALYZING</div>
            <div class="confidence-bar"><div class="confidence-fill" id="confFill"></div></div>
            <div class="confidence-text">Confidence: <span id="confValue">0</span>%</div>
        </div>
        
        <div class="tabs">
            <button class="tab active" onclick="showTab('indicators')">📊 Indicators</button>
            <button class="tab" onclick="showTab('news')">📰 News</button>
            <button class="tab" onclick="showTab('reasoning')">💭 AI</button>
            <button class="tab" onclick="showTab('history')">📜 History</button>
        </div>
        
        <div class="tab-content" id="indicatorsTab">
            <div id="indicatorsList"></div>
        </div>
        
        <div class="tab-content hidden" id="newsTab">
            <div class="news-header">
                <span>Live News Sentiment</span>
                <span id="overallSentiment">--</span>
            </div>
            <div id="newsList"></div>
        </div>
        
        <div class="tab-content hidden" id="reasoningTab">
            <div id="reasoningList"></div>
        </div>
        
        <div class="tab-content hidden" id="historyTab">
            <div class="history-stats">
                <span class="stat winners">✓ <span id="winCount">0</span></span>
                <span class="stat losers">✗ <span id="loseCount">0</span></span>
                <span class="stat exits">⏹ <span id="exitCount">0</span></span>
            </div>
            <div id="historyTable"></div>
        </div>
    </div>
    
    <div class="alert-overlay" id="alertOverlay">
        <div class="alert-box" id="alertBox">
            <div class="alert-title" id="alertTitle">SIGNAL</div>
            <div class="alert-price" id="alertPrice">₹00,000</div>
            <div class="alert-reason" id="alertReason">Reason</div>
            <button class="alert-btn" onclick="closeAlert()">GOT IT</button>
        </div>
    </div>
    
    <script src="app.js"></script>
    <script>
        // Register Service Worker for PWA
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js')
                .then(reg => console.log('SW registered'))
                .catch(err => console.log('SW failed:', err));
        }
    </script>
</body>
</html>
