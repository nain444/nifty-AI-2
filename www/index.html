<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0a0a0f">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>NIFTY AI Trader</title>
    <link rel="manifest" href="manifest.json">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #0a0a0f 0%, #1a1a2e 100%);
            color: #e0e0e0;
            min-height: 100vh;
            overflow-x: hidden;
            padding-bottom: 70px;
        }
        
        /* Header */
        .header {
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(10,10,15,0.95);
            backdrop-filter: blur(10px);
            padding: 12px 15px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }
        
        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .logo { font-size: 1.1em; font-weight: bold; background: linear-gradient(90deg, #667eea, #764ba2); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        
        .status-row {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 0.8em;
        }
        
        .status-dot {
            width: 8px; height: 8px; border-radius: 50%;
            background: #3fb950; box-shadow: 0 0 8px #3fb950;
            animation: pulse 2s infinite;
        }
        .status-dot.off { background: #f85149; box-shadow: 0 0 8px #f85149; }
        
        @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.5; } }
        
        .power-btn {
            width: 44px; height: 44px; border-radius: 50%; border: none;
            background: linear-gradient(135deg, #3fb950, #2ea043);
            color: white; font-size: 1.3em; cursor: pointer;
            box-shadow: 0 4px 15px rgba(63,185,80,0.4);
        }
        .power-btn.off { background: linear-gradient(135deg, #f85149, #da3633); box-shadow: 0 4px 15px rgba(248,81,73,0.4); }
        
        /* Price Section */
        .price-section {
            text-align: center;
            padding: 15px;
            background: rgba(0,0,0,0.3);
            margin: 10px;
            border-radius: 12px;
        }
        
        .price-label { font-size: 0.75em; color: #888; }
        .price-value { font-size: 2.2em; font-weight: bold; }
        .price-value.up { color: #3fb950; }
        .price-value.down { color: #f85149; }
        #priceChange { font-size: 0.9em; margin-top: 5px; }
        
        /* Signal Card */
        .signal-card {
            margin: 10px;
            background: rgba(0,0,0,0.4);
            border-radius: 12px;
            border: 2px solid rgba(255,255,255,0.1);
            overflow: hidden;
        }
        .signal-card.call { border-color: #3fb950; background: linear-gradient(135deg, rgba(63,185,80,0.15), rgba(0,0,0,0.4)); }
        .signal-card.put { border-color: #f85149; background: linear-gradient(135deg, rgba(248,81,73,0.15), rgba(0,0,0,0.4)); }
        .signal-card.exit { border-color: #f0883e; }
        
        .signal-header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 12px 15px; background: rgba(0,0,0,0.3);
        }
        .signal-type { font-size: 1.3em; font-weight: bold; }
        .signal-card.call .signal-type { color: #3fb950; }
        .signal-card.put .signal-type { color: #f85149; }
        .signal-confidence { font-size: 0.85em; color: #888; }
        
        .signal-body { padding: 12px 15px; }
        .signal-row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .signal-row .label { color: #888; font-size: 0.9em; }
        .signal-row .value { font-weight: 600; }
        .signal-row .value.entry { color: #fff; }
        .signal-row .value.target { color: #3fb950; }
        .signal-row .value.stoploss { color: #f85149; }
        
        .signal-footer { display: flex; justify-content: space-between; padding: 10px 15px; background: rgba(0,0,0,0.2); font-size: 0.75em; color: #888; }
        
        /* Tabs */
        .tabs {
            display: flex;
            background: rgba(0,0,0,0.3);
            margin: 10px;
            border-radius: 10px;
            overflow: hidden;
        }
        .tab {
            flex: 1; padding: 12px; text-align: center;
            font-size: 0.85em; color: #888; cursor: pointer;
            border: none; background: none;
        }
        .tab.active { background: rgba(102,126,234,0.3); color: #fff; }
        
        /* Tab Content */
        .tab-content { display: none; padding: 10px; }
        .tab-content.active { display: block; }
        
        /* Indicators */
        .indicator-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
        }
        .indicator-item {
            background: rgba(0,0,0,0.3);
            padding: 10px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .ind-name { font-size: 0.8em; color: #888; }
        .ind-value { font-size: 0.85em; font-weight: 600; }
        .ind-value.bullish { color: #3fb950; }
        .ind-value.bearish { color: #f85149; }
        .ind-value.neutral { color: #f0883e; }
        
        /* Reversal Patterns */
        .pattern-item {
            background: rgba(0,0,0,0.3);
            padding: 10px 12px;
            border-radius: 8px;
            margin-bottom: 8px;
            border-left: 3px solid #667eea;
        }
        .pattern-item.bullish { border-left-color: #3fb950; }
        .pattern-item.bearish { border-left-color: #f85149; }
        .pattern-name { font-weight: 600; font-size: 0.9em; }
        .pattern-desc { font-size: 0.8em; color: #888; margin-top: 4px; }
        
        /* Sources */
        .source-item {
            display: flex; justify-content: space-between;
            padding: 10px 0; border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        .source-name { color: #aaa; font-size: 0.85em; }
        .source-signal { font-weight: 600; font-size: 0.85em; }
        .source-signal.bullish { color: #3fb950; }
        .source-signal.bearish { color: #f85149; }
        
        /* News */
        .news-item {
            padding: 10px 0;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            font-size: 0.85em;
        }
        .news-sentiment { font-size: 0.75em; margin-top: 4px; }
        .news-sentiment.positive { color: #3fb950; }
        .news-sentiment.negative { color: #f85149; }
        
        /* History */
        .history-stats {
            display: flex; justify-content: space-around;
            padding: 15px 0; margin-bottom: 10px;
            background: rgba(0,0,0,0.2); border-radius: 10px;
        }
        .stat { text-align: center; }
        .stat-value { font-size: 1.5em; font-weight: bold; }
        .stat-value.win { color: #3fb950; }
        .stat-value.lose { color: #f85149; }
        .stat-label { font-size: 0.7em; color: #888; }
        
        .history-item {
            display: flex; justify-content: space-between; align-items: center;
            padding: 10px; margin-bottom: 8px;
            background: rgba(0,0,0,0.2); border-radius: 8px;
        }
        .history-item.winner { border-left: 3px solid #3fb950; }
        .history-item.loser { border-left: 3px solid #f85149; }
        .history-time { font-size: 0.75em; color: #888; }
        .history-signal { font-weight: bold; }
        .history-result { font-size: 0.85em; }
        
        /* Alert */
        .alert-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.9);
            display: flex; align-items: center; justify-content: center;
            z-index: 1000; opacity: 0; visibility: hidden;
            transition: all 0.3s;
        }
        .alert-overlay.show { opacity: 1; visibility: visible; }
        
        .alert-box {
            background: #1a1a2e; border-radius: 20px;
            padding: 30px; text-align: center;
            width: 90%; max-width: 350px;
            border: 3px solid;
        }
        .alert-box.call { border-color: #3fb950; box-shadow: 0 0 40px rgba(63,185,80,0.5); }
        .alert-box.put { border-color: #f85149; box-shadow: 0 0 40px rgba(248,81,73,0.5); }
        .alert-box.exit { border-color: #f0883e; }
        
        #alertTitle { font-size: 1.8em; margin-bottom: 15px; }
        #alertPrice { font-size: 1.3em; margin-bottom: 10px; }
        #alertReason { color: #888; font-size: 0.9em; margin-bottom: 15px; }
        .alert-detail { padding: 8px; margin: 5px 0; background: rgba(255,255,255,0.05); border-radius: 8px; }
        
        .alert-close {
            margin-top: 20px; padding: 12px 30px;
            background: rgba(255,255,255,0.1); border: none;
            border-radius: 8px; color: white; font-size: 1em;
        }
        
        /* Bottom Nav */
        .bottom-nav {
            position: fixed; bottom: 0; left: 0; right: 0;
            display: flex; background: rgba(10,10,15,0.98);
            border-top: 1px solid rgba(255,255,255,0.1);
            padding: 8px 0; padding-bottom: max(8px, env(safe-area-inset-bottom));
        }
        .nav-item {
            flex: 1; text-align: center; padding: 8px;
            color: #888; font-size: 0.7em; cursor: pointer;
            background: none; border: none;
        }
        .nav-item.active { color: #667eea; }
        .nav-icon { font-size: 1.4em; margin-bottom: 2px; }
    </style>
</head>
<body>
    <!-- Header -->
    <div class="header">
        <div class="header-top">
            <div class="logo">NIFTY AI v4</div>
            <div class="status-row">
                <div class="status-dot" id="marketDot"></div>
                <span id="marketStatus">--</span>
                <span id="lastUpdate">--:--</span>
            </div>
            <button class="power-btn off" id="powerBtn" onclick="engine.toggleSystem()">⚡</button>
        </div>
    </div>
    
    <!-- Price Section -->
    <div class="price-section">
        <div class="price-label">NIFTY 50</div>
        <div class="price-value" id="price">--</div>
        <div id="priceChange">-- (--)</div>
    </div>
    
    <!-- Signal Card -->
    <div id="signalCard"></div>
    
    <!-- Tabs -->
    <div class="tabs">
        <button class="tab active" onclick="showTab('analysis')">📊 Analysis</button>
        <button class="tab" onclick="showTab('patterns')">🔄 Patterns</button>
        <button class="tab" onclick="showTab('history')">📜 History</button>
    </div>
    
    <!-- Analysis Tab -->
    <div class="tab-content active" id="tab-analysis">
        <div class="indicator-grid" id="indicatorsList"></div>
        <div style="margin-top: 15px;">
            <div style="font-size: 0.8em; color: #888; margin-bottom: 8px;">DATA SOURCES</div>
            <div id="sourcesList"></div>
        </div>
    </div>
    
    <!-- Patterns Tab -->
    <div class="tab-content" id="tab-patterns">
        <div style="font-size: 0.8em; color: #888; margin-bottom: 10px;">DETECTED REVERSAL PATTERNS</div>
        <div id="patternsList"></div>
        <div style="margin-top: 15px; font-size: 0.8em; color: #888; margin-bottom: 10px;">AI REASONING</div>
        <div id="reasoningList"></div>
    </div>
    
    <!-- History Tab -->
    <div class="tab-content" id="tab-history">
        <div class="history-stats">
            <div class="stat"><div class="stat-value win" id="winCount">0</div><div class="stat-label">Winners</div></div>
            <div class="stat"><div class="stat-value lose" id="loseCount">0</div><div class="stat-label">Losers</div></div>
            <div class="stat"><div class="stat-value" id="totalCount">0</div><div class="stat-label">Total</div></div>
        </div>
        <div id="historyTable"></div>
    </div>
    
    <!-- Alert Overlay -->
    <div class="alert-overlay" id="alertOverlay" onclick="closeAlert()">
        <div class="alert-box" id="alertBox" onclick="event.stopPropagation()">
            <div id="alertTitle">SIGNAL</div>
            <div id="alertPrice">₹0.00</div>
            <div id="alertReason">--</div>
            <div id="alertDetails"></div>
            <button class="alert-close" onclick="closeAlert()">CLOSE</button>
        </div>
    </div>
    
    <script src="app.js"></script>
    <script>
        function showTab(tab) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            event.target.classList.add('active');
            document.getElementById('tab-' + tab).classList.add('active');
        }
        function closeAlert() { document.getElementById('alertOverlay').classList.remove('show'); }
    </script>
</body>
</html>
